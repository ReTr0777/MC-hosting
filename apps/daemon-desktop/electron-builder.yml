appId: com.mchosting.node
productName: MC Hosting Node
copyright: MC Hosting

# npm workspaces hoist electron to the repo-root node_modules, where electron-builder
# does not look. Stating the version outright is simpler than fighting the hoisting;
# keep it in step with the devDependency in package.json.
electronVersion: 33.4.11

directories:
  output: release
  buildResources: build

# The app has no runtime dependencies of its own — dist/ is self-contained and the
# daemon ships under extraResources with its own node_modules. Leaving this on makes
# electron-builder run a production install in this directory, which npm resolves
# against the workspace root and which then prunes every devDependency there
# (electron and electron-builder included). There is nothing here to rebuild.
npmRebuild: false

# The daemon is packed *into* app.asar rather than shipped alongside it.
#
# It used to be an extraResources folder, which lands as ~7000 loose files under
# resources/daemon. An auto-update restored the shallow files but not the
# node_modules tree beneath them, so updated nodes died on "Cannot find module
# 'express'". app.asar is one file, and replacing it wholesale is the update path
# Electron is built around — the tree cannot be half-applied.
#
# daemon-runtime/ is produced by `npm run stage`. It cannot live under build/,
# because that is buildResources and electron-builder never packs it.
files:
  - dist/**/*
  - daemon-runtime/**/*
  - package.json

# No asarUnpack: nothing in the packaged app loads a native addon. The daemon's two
# optional ones (ssh2's crypto binding and cpu-features) are left out of the bundle
# entirely — see scripts/bundle-daemon.mjs.

# frpc is the one thing that cannot live in the asar: Windows cannot execute a binary
# that exists only inside an archive. It is a single file rather than a tree, and the
# daemon now survives its absence, so losing it costs the tunnel and nothing else.
# Fetched and checksum-verified by scripts/fetch-frpc.mjs during `npm run stage`.
extraResources:
  - from: build/frpc/frpc.exe
    to: frpc.exe

win:
  target:
    - target: nsis
      arch: [x64]
  icon: build/icon.ico
  # Off because signing pulls down electron-builder's winCodeSign toolchain, whose
  # archive contains macOS symlinks that Windows refuses to extract without
  # Developer Mode or an elevated shell — it fails the build on a normal account.
  #
  # Unsigned builds trip SmartScreen on first run. To sign, set CSC_LINK and
  # CSC_KEY_PASSWORD, flip this to true, and build from an elevated prompt (or turn
  # on Developer Mode) so the toolchain can unpack.
  signAndEditExecutable: false

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: MC Hosting Node
  # Removes the auto-start registry value NSIS does not know about.
  include: nsis/installer.nsh
  # Never true here: the app's data directory holds config.json *and* every world
  # this node hosts (dataDir is <userData>/data/servers). Wiping it on uninstall
  # would delete the servers along with the app.
  deleteAppDataOnUninstall: false

# Installed nodes check GitHub Releases for updates. `--publish always` uploads the
# installer plus the latest.yml manifest electron-updater reads; `--publish never`
# (the default build) only writes to release/ locally.
#
# The releases must be readable without credentials — an installed node has no
# GitHub token. A private repo would mean shipping one to every machine.
publish:
  provider: github
  owner: ReTr0777
  repo: MC-hosting
  # Published, not the default draft: electron-updater only ever sees published
  # releases, so a draft would upload fine and update nobody.
  releaseType: release
