config-version = "2.8"
bind = "0.0.0.0:25565"
motd = "<#09b9fd>MCManager Proxy</#09b9fd>"
show-max-players = 1000

player-info-forwarding-mode = "none"
forwarding-secret-file = "forwarding.secret"
force-key-authentication = false

[servers]
# Only limbo is static. Every game server is registered at runtime by the panel, under its
# server id and with the hostnames it answers for — see VelocityRestPlugin.
nanolimbo = "nanolimbo:25565"

# Where a player goes when nothing claims the hostname they typed. Limbo, so an unknown
# address is a world with an explanation in it rather than a refused connection. The plugin
# overrides this for anyone whose hostname does resolve.
try = ["nanolimbo"]

[forced-hosts]
"nanolimbo.local" = ["nanolimbo"]

[advanced]
