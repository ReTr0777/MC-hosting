version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: mc_postgres
    restart: always
    environment:
      POSTGRES_USER: mcuser
      POSTGRES_PASSWORD: mcpassword
      POSTGRES_DB: mcmanager
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    image: ghcr.io/retr0777/mc-hosting:web
    container_name: mc_web_panel
    restart: always
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: "postgresql://mcuser:mcpassword@db:5432/mcmanager?schema=public"
      JWT_SECRET: "super-secret-local-testing-jwt-key"
      # The address users reach the panel on. Emailed verification and password-reset links
      # are built from it. Without it the links fall back to the request's Host header.
      APP_URL: "${APP_URL:-}"
      # Encrypts secrets at rest. Keep stable across deploys — changing it makes
      # the stored Cloudflare API token undecryptable.
      SECRET_ENCRYPTION_KEY: "super-secret-local-testing-encryption-key"
      # Must match discord-bot's DISCORD_BOT_SECRET. Leave unset to disable the Discord integration.
      DISCORD_BOT_SECRET: "${DISCORD_BOT_SECRET:-}"
      # How the *panel* dials the tunnel server, when a self-enrolled node has to be
      # published through it. Nodes dial the public address configured in Settings; the
      # panel is on the same Docker network and reaches the same server by container
      # name, so it needs its own value. Leave unset to use the public address for both.
      FRP_PANEL_HOST: "mc_frps"
      # Remote ports frps may publish node APIs on, for a machine the panel cannot reach
      # directly. Must be a range frps actually publishes on its host, or the node
      # registers against a port nothing is listening on and never comes online.
      NODE_TUNNEL_PORT_RANGE: "25051-25100"
      PORT: 3000
    depends_on:
      - db

  daemon:
    build:
      context: .
      dockerfile: apps/daemon/Dockerfile
    image: ghcr.io/retr0777/mc-hosting:daemon
    container_name: mc_daemon_node
    restart: always
    ports:
      - "3500:3500"
    environment:
      DAEMON_API_KEY: "local-daemon-testing-bearer-key"
      DAEMON_PORT: 3500
      # HOST_DATA_DIR is deliberately unset here: this stack keeps the daemon's data in a
      # named volume, so there is no host path to hand to the game containers, and they
      # get named volumes of their own. That is fine for local testing and wrong for a
      # real deployment — see deploy/docker-compose.prod.yml.
      FRP_SERVER_ADDR: "mc_frps"
      FRP_SERVER_PORT: 7000
      FRP_TOKEN: "craftcontrol-tunnel-secret"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - daemon_data:/app/apps/daemon/data

  frps:
    image: fatedier/frps:v0.58.0
    container_name: mc_frps
    restart: always
    command: -c /etc/frp/frps.toml
    ports:
      - "7000:7000"
      - "24000-24010:24000-24010" # Reduced range for docker compose compatibility/performance
      # Node APIs tunnelled here — see NODE_TUNNEL_PORT_RANGE on the web service. Published
      # separately because these carry the panel's control channel, not player traffic.
      - "25051-25100:25051-25100"
    volumes:
      - ./deploy/frps.toml:/etc/frp/frps.toml

  nanolimbo:
    build:
      context: .
      dockerfile: apps/nanolimbo/Dockerfile
    image: ghcr.io/retr0777/mc-hosting:nanolimbo
    container_name: mc_nanolimbo
    restart: always

  proxy:
    build:
      context: .
      dockerfile: apps/proxy/Dockerfile
    image: ghcr.io/retr0777/mc-hosting:proxy
    container_name: mc_velocity_proxy
    restart: always
    ports:
      - "25565:25565" # Velocity public player port
      - "3001:3001"   # Velocity REST API
    depends_on:
      - nanolimbo

  # Discord slash-command bot (/status, /start, /stop, /restart). Reads its secrets from
  # the repo-root .env file (gitignored) — see .env.example. Exits immediately if
  # DISCORD_BOT_TOKEN/DISCORD_CLIENT_ID aren't set.
  discord-bot:
    build:
      context: .
      dockerfile: apps/discord-bot/Dockerfile
    image: ghcr.io/retr0777/mc-hosting:discord-bot
    container_name: mc_discord_bot
    restart: always
    environment:
      DISCORD_BOT_TOKEN: "${DISCORD_BOT_TOKEN:-}"
      DISCORD_CLIENT_ID: "${DISCORD_CLIENT_ID:-}"
      DISCORD_GUILD_ID: "${DISCORD_GUILD_ID:-}"
      WEB_API_URL: "http://web:3000"
      DISCORD_BOT_SECRET: "${DISCORD_BOT_SECRET:-}"
    depends_on:
      - web

volumes:
  pgdata:
  daemon_data:
