# Production stack, as deployed to the Unraid box by Jenkinsfile.
#
# The difference from the repo-root docker-compose.yml is that nothing here builds. Every
# image is pulled from ghcr.io, already built and tested by the pipeline, so the Unraid box
# never needs a checkout, a toolchain or the time to compile anything.
#
# Postgres is deliberately absent. The database already exists on this network with real
# data in it, and a compose file that brought up its own would either fight it for the port
# or quietly start an empty one and make the panel look wiped. Point DB_HOST at the
# existing server.
#
# Configuration comes from a `.env` file next to this one, on the Unraid box, which the
# pipeline never writes to — see deploy/env.prod.example for what belongs in it. The one
# exception is DB_PASSWORD, which Jenkins passes in the environment at deploy time so the
# database password is not sitting in a file on the array.

services:
  web:
    image: ghcr.io/retr0777/mc-hosting:web
    container_name: mc_web_panel
    restart: always
    ports:
      - "${WEB_PORT:-3000}:3000"
    environment:
      DATABASE_URL: "postgresql://${DB_USER:-mcuser}:${DB_PASSWORD}@${DB_HOST}:${DB_PORT:-5432}/${DB_NAME:-mcmanager}?schema=public"
      APP_URL: "${APP_URL:-}"
      JWT_SECRET: "${JWT_SECRET}"
      # Changing this makes every stored secret — the Cloudflare token above all —
      # undecryptable. It is not a value to rotate casually.
      SECRET_ENCRYPTION_KEY: "${SECRET_ENCRYPTION_KEY}"
      DISCORD_BOT_SECRET: "${DISCORD_BOT_SECRET:-}"
      # How the *panel* dials the tunnel server, when a self-enrolled node has to be
      # published through it. Nodes dial the public address configured in Settings; the
      # panel is on the same Docker network and reaches the same server by container
      # name, so it needs its own value. Leave unset to use the public address for both.
      FRP_PANEL_HOST: "${FRP_PANEL_HOST:-}"
      # Remote ports frps may publish node APIs on, for a machine the panel cannot reach
      # directly. Must be a range frps actually publishes on its host, or the node
      # registers against a port nothing is listening on and never comes online.
      NODE_TUNNEL_PORT_RANGE: "${NODE_TUNNEL_PORT_RANGE:-25051-25100}"
      PORT: 3000

  daemon:
    image: ghcr.io/retr0777/mc-hosting:daemon
    container_name: mc_daemon_node
    restart: always
    ports:
      - "${DAEMON_PORT:-3500}:3500"
      # The range game servers are allocated from. Published here rather than per server,
      # since the daemon hands ports out at runtime and compose is not around to hear it.
      - "${SERVER_PORT_RANGE:-24000-25000}:${SERVER_PORT_RANGE:-24000-25000}"
    environment:
      DAEMON_API_KEY: "${DAEMON_API_KEY}"
      DAEMON_PORT: 3500
      # Where the *host* keeps server data, so game containers bind-mount it instead of
      # being given a named Docker volume. Without this every world lives under Docker's
      # own storage — on Unraid, inside the docker vDisk, which is a fixed size shared
      # with every image on the machine. Filling it stops Docker writing at all, and
      # takes the rest of the box with it.
      #
      # The host path that appears inside the daemon as its own server directory: the
      # volume mounted at /app/data below, plus the `servers` subdirectory the daemon
      # keeps them in (DAEMON_DATA_DIR=/app/data/servers in the image). Get this wrong and
      # the daemon and the game container are each looking at a different directory:
      # exports tar an empty one, and installed mods are written where nothing reads them.
      HOST_DATA_DIR: "${DAEMON_DATA:-/mnt/user/appdata/craftcontrol}/servers"
      FRP_SERVER_ADDR: "mc_frps"
      FRP_SERVER_PORT: 7000
      FRP_TOKEN: "${FRP_TOKEN}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # /app/data, not /app/apps/daemon/data: the latter is not where the daemon looks,
      # and mounting there persists nothing while leaving the running node apparently fine
      # until the first restart.
      - "${DAEMON_DATA:-/mnt/user/appdata/craftcontrol}:/app/data"

  frps:
    image: fatedier/frps:v0.58.0
    container_name: mc_frps
    restart: always
    command: -c /etc/frp/frps.toml
    ports:
      - "7000:7000"
      - "${TUNNEL_PORT_RANGE:-24000-25000}:${TUNNEL_PORT_RANGE:-24000-25000}"
      # The node APIs of self-enrolled machines. frps will accept a proxy on any port it
      # is asked for; unpublished, the panel dials it from outside and reaches nothing.
      - "${NODE_TUNNEL_PORT_RANGE:-25051-25100}:${NODE_TUNNEL_PORT_RANGE:-25051-25100}"
    volumes:
      - ./frps.toml:/etc/frp/frps.toml

  nanolimbo:
    image: ghcr.io/retr0777/mc-hosting:nanolimbo
    container_name: mc_nanolimbo
    restart: always

  proxy:
    image: ghcr.io/retr0777/mc-hosting:proxy
    container_name: mc_velocity_proxy
    restart: always
    ports:
      - "${PROXY_PORT:-25565}:25565"
      - "3001:3001"
    depends_on:
      - nanolimbo

  discord-bot:
    image: ghcr.io/retr0777/mc-hosting:discord-bot
    container_name: mc_discord_bot
    restart: always
    environment:
      DISCORD_BOT_TOKEN: "${DISCORD_BOT_TOKEN:-}"
      DISCORD_CLIENT_ID: "${DISCORD_CLIENT_ID:-}"
      DISCORD_GUILD_ID: "${DISCORD_GUILD_ID:-}"
      WEB_API_URL: "http://web:3000"
      DISCORD_BOT_SECRET: "${DISCORD_BOT_SECRET:-}"
    depends_on:
      - web
